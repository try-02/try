[versions]
# Core Build & Kotlin
agp = "9.5.0-alpha02"
kotlin = "2.4.20-RC"
ksp = "2.3.11"
kotlinxSerialization = "1.11.0"
kotlinMultiplatform = "2.4.20-RC"   # sama dgn kotlin; untuk plugin kmp
akml = "9.3.0-alpha03"

# Database & Async
room3 = "3.0.1"
sqlite = "2.7.0"
coroutines = "1.11.0"

# AndroidX & Lifecycle
coreKtx = "1.19.0"
lifecycle = "2.12.0-alpha01"
activityCompose = "1.13.0"

# Compose
composeBom = "2026.08.00"
navigationCompose = "2.10.0-rc01" # Versi standar penunjang Compose
paging = "3.5.1"             # Penunjang rekomendasi pagination kita
material-icon = "1.7.8"

# Dependency Injection
koin = "4.2.2" # Versi Koin mutakhir untuk Compose

# Hardware & Utilities (POS Specific)
escpos = "3.4.0"
camerax = "1.7.0-alpha03"
mlkitBarcode = "17.3.0"
fastexcel = "0.20.2"
aaltoXml = "1.4.0"
staxApi = "1.0-2"
splash = "1.2.0"
google-material = "1.14.0"
slack-compose-lint = "1.5.4"

# Test
junit = "4.13.2"
mockk = "1.14.11"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"

[libraries]
# Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-core-splash = { group = "androidx.core", name = "core-splashscreen", version.ref = "splash" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "google-material" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Compose Framework
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icon = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "material-icon" }
androidx-compose-material-icon-ext = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "material-icon" }

# Navigation & Paging
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

# Database (Room 3.0.1 + Bundled SQLite)
room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
room3-paging = { group = "androidx.room3", name = "room3-paging", version.ref = "room3" }
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
# iOS native SQLite driver (butuh linker -lsqlite3) — alternatif sqlite-bundled yang cross-platform
sqlite-native = { group = "androidx.sqlite", name = "sqlite-framework", version.ref = "sqlite" }

# Async / Coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Dependency Injection (Koin) — core KMP + Android
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Hardware Integration (Printer & Barcode Scanner)
escpos-printer = { group = "com.github.DantSu", name = "ESCPOS-ThermalPrinter-Android", version.ref = "escpos" }
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
mlkit-barcode = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
slack-compose-lints = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "slack-compose-lint" }

# Export/Import Reports
fastexcel = { group = "org.dhatim", name = "fastexcel", version.ref = "fastexcel" }
aalto-xml = { group = "com.fasterxml", name = "aalto-xml", version.ref = "aaltoXml" }
stax-api = { group = "javax.xml.stream", name = "stax-api", version.ref = "staxApi" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-room3-testing = { group = "androidx.room3", name = "room-testing", version.ref = "room3" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
room3-testing = { group = "androidx.room3", name = "room3-testing-android", version.ref = "room3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" } # Wajib untuk Kotlin 2.x
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "room3" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
stability-analyzer = { id = "com.github.skydoves.compose.stability.analyzer", version = "0.13.0" }
# KMP
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlinMultiplatform" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "akml" }
