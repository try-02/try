name: 🧹 Nuke Caches & Artifacts

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: 🗑️ Hapus Semua GitHub Actions Cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== CACHE CLEANUP ==="

          gh cache list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json id,key,sizeInBytes

          gh cache delete \
            --repo "${{ github.repository }}" \
            --all \
            --succeed-on-no-caches

          echo "✅ Semua GitHub Actions cache telah dihapus."

      - name: 🗑️ Hapus Semua Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== ARTIFACT CLEANUP ==="

          gh api \
            --paginate \
            "repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts[].id' |
          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue

            echo "Menghapus artifact ID: $artifact_id"

            gh api \
              --method DELETE \
              "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
          done

          echo "✅ Semua artifacts telah dihapus."