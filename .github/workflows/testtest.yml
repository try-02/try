name: Android CI Tests 0000

on:
  workflow_dispatch:

# Membatalkan tes lama yang masih berjalan jika ada push kode baru (menghemat kuota)
concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./coba9

jobs:
  test:
    name: Run Unit & UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Setup Gradle dengan caching otomatis & Enkripsi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: Enhanced
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: on-failure
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      # 1. Memberikan izin eksekusi Gradle
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run Pure Unit Tests
        run: ./gradlew :shared:assemble --stacktrace
      - name: check
        run: ./gradlew check

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: coba9/app/build/
          retention-days: 1
