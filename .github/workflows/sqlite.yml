name: Optimized Build better-sqlite3 (Termux ARM64)

on:
  workflow_dispatch:
    inputs:
      node_package:
        description: 'Pilih paket Node.js di Termux'
        required: true
        default: 'nodejs'
        type: choice
        options:
          - nodejs
          - nodejs-lts
      sqlite_version:
        description: 'Versi better-sqlite3'
        required: true
        default: 'latest'

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Create output directory
        run: |
          mkdir -p output
          chmod 777 output

      - name: Build better-sqlite3 inside Official Termux Docker
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}/output:/output" \
            ghcr.io/termux-user-repository/termux-docker:aarch64 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              echo '=== 1. Update Core System & Libc++ ==='
              apt update
              apt -y -o Dpkg::Options::=\"--force-confnew\" full-upgrade

              echo '=== 2. Install Compiler & Node.js ==='
              apt install -yq -o Dpkg::Options::=\"--force-confnew\" ${{ inputs.node_package }} python make clang binutils build-essential libc++

              # Bersihkan config foreground-scripts npm
              npm config delete foreground-scripts || true

              echo '=== 3. Cek Versi Node & NPM ==='
              node -v
              npm -v

              echo '=== 4. Download Package better-sqlite3 ==='
              mkdir -p /data/data/com.termux/files/home/build
              cd /data/data/com.termux/files/home/build
              npm init -y
              npm install better-sqlite3@${{ inputs.sqlite_version }} --ignore-scripts

              echo '=== 5. Kompilasi Native C++ Module ==='
              cd node_modules/better-sqlite3
              npm run build-release

              echo '=== 6. Test Import Module di Node.js ==='
              node -e \"const Database = require('.'); console.log('SUCCESS: better-sqlite3 berhasil di-load!');\"

              echo '=== 7. Verifikasi File Binary ==='
              ls -la build/Release/better_sqlite3.node

              echo '=== 8. Mengarsipkan Modul ==='
              cd /data/data/com.termux/files/home/build
              tar --hard-dereference -czvf /output/better-sqlite3-termux-aarch64.tar.gz -C node_modules better-sqlite3
              echo '=== Build Selesai! ==='
            "

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-sqlite3-termux-aarch64
          path: output/better-sqlite3-termux-aarch64.tar.gz
          retention-days: 1